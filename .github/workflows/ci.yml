name: CI

on:
  push:
    branches: ['**'] # run on pushes to all branches
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'examples/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'vite.config.mjs'
      - 'vitest.config.mjs'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.github/workflows/**'
  pull_request:
    branches: ['**'] # run on PRs against any branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job: format/lint, webpack build, Vite build, then tests with coverage.
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prettier check
        run: npm run format-check

      - name: ESLint
        run: npm run lint

      # Vite library build (ESM + CJS)
      - name: Build (Vite)
        run: npm run build:vite

      # The public declarations, checked the way a consumer imports them
      # (package.json "exports", moduleResolution "bundler").
      - name: Type declarations
        run: |
          npm run build:types
          npm run test:types

      # The example links this repository's dist/ (file:../..), so it builds
      # after the library. Catches a core change, or a plugin or Vite release,
      # that breaks a consumer's install or production build.
      - name: Build vite-artoolkit example
        run: |
          npm --prefix examples/vite-artoolkit ci
          npm --prefix examples/vite-artoolkit run build

      - name: Run tests (with coverage)
        run: npm run test:coverage
        env:
          CI: true

      # Reports to Codecov. Needs the CODECOV_TOKEN repository secret; a failed
      # upload does not fail the build.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
